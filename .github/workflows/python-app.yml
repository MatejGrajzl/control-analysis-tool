name: Control Analysis checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile control_analysis.py

      - name: Exercise all five plotting functions
        run: |
          python - <<'PY'
          import matplotlib.pyplot as plt
          import control_analysis as app

          # Check plotting without opening windows or asking for input.
          plt.show = lambda: None
          numerator = [1.0]
          denominator = [1.0, 0.4, 0.5]
          functions = [
              app.bode_diagram,
              app.step_response,
              app.impulse_response,
              app.poles_zeros_gain,
              app.root_locus,
          ]
          for function in functions:
              function(numerator, denominator)
              plt.close("all")
              print(f"PASS: {function.__name__}")
          PY

